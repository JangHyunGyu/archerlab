name: Service DNS routing
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: inspect
        options: [inspect, pages-direct, pages-proxied, static-direct, static-proxied]
      target:
        type: choice
        default: all-pages
        options: [all-pages, all-static, golf.archerlab.dev, game.archerlab.dev, nevergrad.archerlab.dev, karma.archerlab.dev, harem.archerlab.dev, cupid.archerlab.dev, chatbot.archerlab.dev, itstory.archerlab.dev, chat.archerlab.dev]

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read service DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DNS_MODE: ${{ inputs.mode }}
          DNS_TARGET: ${{ inputs.target }}
        run: python auth/scripts/dns-routing.py
      - uses: actions/upload-artifact@v4
        with:
          name: service-dns
          path: service-dns.json
          retention-days: 7
